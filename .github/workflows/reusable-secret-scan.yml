name: reusable-secret-scan

# Scans each pull request's commits for secrets with gitleaks, against the org's rules
# (.gitleaks.toml in this repo), and fails on a finding. A repo calls it from its own
# .github/workflows/secret-scan.yml, a copy of workflow-templates/secret-scan.yml;
# scripts/create-repo.sh commits it to every new repo.
#
# Public repos also have GitHub's secret scanning and push protection (settings.yml), which
# GitHub Free doesn't offer private repos; for those, this is the only check on new commits.
# make-public.sh scans a repo's whole history once more, with trufflehog too, before it goes
# public.
#
# A repo makes its own exceptions where they're committed and reviewed: a finding's
# fingerprint in the repo's .gitleaksignore, or a gitleaks:allow comment on the line.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: repo
          persist-credentials: false

      # The org's rules and the scanner download, from main, never from the pull request.
      - name: Check out the org's rules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: swimblocks/.github
          ref: main
          path: org
          persist-credentials: false

      - name: Download gitleaks
        id: fetch
        run: echo "path=$(org/scripts/fetch-scanner.sh gitleaks "$RUNNER_TEMP/gitleaks")" >> "$GITHUB_OUTPUT"

      - name: Scan the pull request's commits
        env:
          GITLEAKS: ${{ steps.fetch.outputs.path }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if ! "$GITLEAKS" git repo --log-opts="$BASE..$HEAD" --config org/.gitleaks.toml \
              --gitleaks-ignore-path repo --no-banner --redact --verbose; then
            {
              echo "### gitleaks found a secret"
              echo
              echo "The log above names each finding's commit, file and line. Rotate a real"
              echo "secret: it is in the branch's history, so removing it in a new commit isn't"
              echo "enough. For a false positive, add its fingerprint to the repo's"
              echo "\`.gitleaksignore\`, or mark the line \`gitleaks:allow\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
