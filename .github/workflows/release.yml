name: release

# Publishes the weekly settings release: a dated tag pinning `.github/settings.yml`
# and `scripts/apply-settings.py` at the version the org is on. Publishing the
# release is what starts `rollout.yml`.
#
# The release also keeps this repo's scheduled workflows alive. GitHub disables a
# scheduled workflow in a public repo after 60 days without repository *activity*,
# and workflow runs are not activity — the reconciler this replaces ran every
# Monday through its quiet window and was disabled anyway, because its whole
# effect was on other repositories. A published release is an event in this repo,
# so a weekly cadence keeps the clock reset regardless of how quiet the org is.
#
# See https://github.com/swimblocks/.github/issues/34 and
# docs/design/0003-settings-releases-and-rollout.md.

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch:

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # The `swimblocks-releaser` App, not GITHUB_TOKEN: an event raised by
      # GITHUB_TOKEN starts no further workflow run, so a release cut with it
      # would never reach `rollout.yml`. A separate App keeps Contents write off
      # `swimblocks-reconciler`, which is installed on every repo in the org —
      # this one is installed on `.github` alone. See docs/reconciler.md.
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: swimblocks
          repositories: .github

      - name: Publish the settings release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          tag="settings-$(date -u +'%Y-%m-%d')"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::$tag is already published; nothing to do."
            exit 0
          fi
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Settings $(date -u +'%B %-d, %Y')" \
            --generate-notes
