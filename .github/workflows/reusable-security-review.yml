name: reusable-security-review

# The automatic security review for SwimBlocks pull requests (docs/security-review.md). Each
# job checks one rule of the security guide (docs/security/README.md) and reports its own
# check, `security / <job>`, so each can be required on its own. A repo calls it from its own
# .github/workflows/security-review.yml, a copy of workflow-templates/security-review.yml;
# scripts/create-repo.sh commits it to every new repo. A new check is a new job here, and
# needs no change in any repo.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  # security/secrets: gitleaks scans the pull request's commits against the org's rules
  # (.gitleaks.toml in this repo) and the repo's own exceptions (its .gitleaksignore, and
  # gitleaks:allow comments). Public repos also have GitHub's secret scanning and push
  # protection, which GitHub Free doesn't offer private repos; for those, this is the only
  # check on new commits.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: repo
          persist-credentials: false

      # The org's rules and the scanner download, from main, never from the pull request.
      - name: Check out the org's rules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: swimblocks/.github
          ref: main
          path: org
          persist-credentials: false

      # A plain assignment, so a failed download (a checksum mismatch, say) fails this step,
      # where an echo of the command's output would succeed with an empty path.
      - name: Download gitleaks
        id: fetch
        run: |
          path=$(org/scripts/fetch-scanner.sh gitleaks "$RUNNER_TEMP/gitleaks")
          echo "path=$path" >> "$GITHUB_OUTPUT"

      # --text scans a file even if the repo's .gitattributes marks it binary (-diff), which
      # would otherwise hide its patch. --diff-merges=first-parent scans each merge against the
      # branch it was made on, so a secret typed while resolving a conflict is seen; plain
      # `git log -p` prints no patch for a merge. Findings exit 2, so a scan that couldn't run
      # (exit 1) isn't reported as a secret.
      - name: Scan the pull request's commits
        env:
          GITLEAKS: ${{ steps.fetch.outputs.path }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          "$GITLEAKS" git repo --log-opts="--text --diff-merges=first-parent $BASE..$HEAD" \
            --config org/.gitleaks.toml --gitleaks-ignore-path repo \
            --no-banner --redact --verbose --exit-code 2 || status=$?
          if [ "$status" -eq 2 ]; then
            {
              echo "### gitleaks found a secret"
              echo
              echo "The job's log names each finding's commit, file and line. Rotate a real"
              echo "secret: it is in the branch's history, so removing it in a new commit isn't"
              echo "enough. For a false positive, add its fingerprint to the repo's"
              echo "\`.gitleaksignore\`, or mark the line \`gitleaks:allow\`."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "$status" -ne 0 ]; then
            echo "### gitleaks couldn't scan (exit $status); see the job's log" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
