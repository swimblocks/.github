name: rollout

# Applies a settings release to every repo in the swimblocks org: checks out the
# released tag and runs `scripts/apply-settings.py` across the org. Because it
# re-asserts every setting, it is also the drift check — a merge method flipped
# through the GitHub UI is put back on the next rollout.
#
# It carries no `schedule` trigger, which is the point: only scheduled workflows
# are eligible for GitHub's inactivity disabling, so the path that actually
# changes repos cannot go dormant. The weekly cadence comes from release.yml.
#
# See https://github.com/swimblocks/.github/issues/34 and
# docs/design/0003-settings-releases-and-rollout.md.

on:
  # A release cut by hand. The weekly one from release.yml arrives via
  # workflow_dispatch instead — see the comment on that workflow's dispatch step.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Settings release to roll out (default: the latest release)"
        required: false
        type: string
  # Sent by an org-level webhook on `repository.created`, so a repo created
  # without scripts/create-repo.sh is reconciled immediately rather than waiting
  # for the next weekly release.
  repository_dispatch:
    types: [repo-created]

permissions:
  contents: read   # read the release and check out its tag

jobs:
  rollout:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the settings version to roll out
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG:-${INPUT_TAG:-}}"
          if [ -z "$tag" ]; then
            tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName) || {
              echo "::error::No settings release to roll out — run the release workflow first."
              exit 1
            }
          fi
          echo "Rolling out $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: swimblocks

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.version.outputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install --quiet -r requirements.txt

      - name: Apply settings to every repo in swimblocks
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          repos=$(gh repo list swimblocks --limit 200 --json nameWithOwner --jq '.[].nameWithOwner')
          if [ -z "$repos" ]; then
            echo "No repos found — app may lack visibility into the org."
            exit 1
          fi
          # One repo's failure must not strand the rest: apply-settings.py
          # accumulates failures and exits non-zero at the end, so the run still
          # goes red without stopping at the first bad repo.
          # shellcheck disable=SC2086
          python scripts/apply-settings.py \
            --version "$TAG" \
            --summary-file "$GITHUB_STEP_SUMMARY" \
            $repos
